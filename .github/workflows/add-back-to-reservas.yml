name: Add back to reservations

on:
  push:
    paths:
      - .github/workflows/add-back-to-reservas.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Install back to reservations patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add back button to premios page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('premiosreactivacion.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#DCEFEC;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;}'
          new_css = old_css + '\n.hi-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}\n.back-manager{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--coral);color:#fff;border:1px solid var(--coral);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;}\n.back-manager:hover{background:var(--coral-dark);border-color:var(--coral-dark);}\n.back-manager:focus-visible{outline:2px solid #fff;outline-offset:2px;}\n@media(max-width:560px){.hi{align-items:flex-start}.hi-actions{gap:6px}.back-manager{padding:7px 11px;font-size:12px}}'
          if '.back-manager{' not in s:
              if old_css not in s: raise SystemExit('No se encontró CSS de chip')
              s = s.replace(old_css, new_css, 1)

          old_header = '''  <div><div class="wm">BAHÍA PADEL</div><div class="tag">Premios · Reactivación</div></div>\n  <div class="chip" id="userChip">Recepción</div>'''
          new_header = '''  <div><div class="wm">BAHÍA PADEL</div><div class="tag">Premios · Reactivación</div></div>\n  <div class="hi-actions"><a class="back-manager" href="/">← Volver a reservas</a><div class="chip" id="userChip">Recepción</div></div>'''
          if '← Volver a reservas' not in s:
              if old_header not in s: raise SystemExit('No se encontró encabezado esperado')
              s = s.replace(old_header, new_header, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "Bahia Padel Automation"
          git config user.email "actions@users.noreply.github.com"
          git add premiosreactivacion.html
          git commit -m "Add back to reservations button in premiaciones"
          git push origin HEAD:main

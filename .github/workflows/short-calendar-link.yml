name: Short calendar link

on:
  push:
    paths:
      - .github/workflows/short-calendar-link.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Install short calendar link patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Shorten calendar link in confirmation message
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/confirmacion.js')
          s=p.read_text(encoding='utf-8')

          marker='''function linkOutlook(ev) {'''
          helper='''function linkGoogleCorto(r) {\n  const d = String(r.fecha || "").replace(/\\D/g, "");\n  const ini = String(r.startTime || "").replace(/\\D/g, "").slice(0, 4);\n  const fin = String(r.endTime || "").replace(/\\D/g, "").slice(0, 4);\n  const mc = String(r.court || "").match(/\\d+/);\n  const p = new URLSearchParams({ d, h: ini + "-" + fin });\n  if (mc) p.set("c", mc[0]);\n  return "https://padelmanagerb.netlify.app/c?" + p.toString();\n}\n\n'''
          if 'function linkGoogleCorto(r)' not in s:
              if marker not in s: raise SystemExit('No se encontró linkOutlook')
              s=s.replace(marker, helper+marker, 1)

          old='''      wa_text: textoWhatsApp(r, linkGoogle(evPrev), "REQUEST"),'''
          new='''      wa_text: textoWhatsApp(r, linkGoogleCorto(r), "REQUEST"),'''
          if old in s:
              s=s.replace(old,new,1)

          old2='''  const gcal    = linkGoogle(ev);\n  const outlook = linkOutlook(ev);\n  const wa_text = textoWhatsApp(r, gcal, metodo);'''
          new2='''  const gcal      = linkGoogle(ev);\n  const gcalCorto = linkGoogleCorto(r);\n  const outlook   = linkOutlook(ev);\n  const wa_text   = textoWhatsApp(r, gcalCorto, metodo);'''
          if old2 not in s:
              raise SystemExit('No se encontró bloque gcal/outlook/wa_text')
          s=s.replace(old2,new2,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "Bahia Padel Automation"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/confirmacion.js
          git commit -m "Use short calendar link in reservation confirmations"
          git push origin HEAD:main
